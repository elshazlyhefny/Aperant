# Cross-Platform CI Pipeline
#
# Tests on all target platforms (Linux, Windows, macOS) to catch
# platform-specific bugs before they merge. ALL platforms must pass.
#
# Optimized: Frontend-only matrix, path filters to skip on docs-only changes.

name: CI

on:
  push:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

  # Weekly run: new advisories appear without code changes. Path filters only
  # apply to push and pull_request, so they are unaffected.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # Frontend Tests - All Platforms
  # --------------------------------------------------------------------------
  test-frontend:
    name: test-frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # zeenha fork: only Linux is shipped, and Windows has unported test failures.
        # macOS runs in test-frontend-macos below so it does not gate CI Complete.
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: npm run test:coverage

      - name: Run integration tests
        working-directory: apps/desktop
        run: npm run test:integration

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/desktop/coverage/
          retention-days: 14

      - name: Coverage PR comment
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/desktop
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Build application
        working-directory: apps/desktop
        run: npm run build

  # --------------------------------------------------------------------------
  # Frontend Tests - macOS (advisory)
  # --------------------------------------------------------------------------
  # zeenha fork: hosted macOS arm64 runners are capacity-constrained, and jobs are
  # often cancelled with "The job was not acquired by Runner of type hosted even
  # after multiple attempts". That turned CI Complete red on PRs that had no macOS
  # test failures. The job still runs and reports, but CI Complete does not need it.
  test-frontend-macos:
    name: test-frontend (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Run unit tests
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Run integration tests
        working-directory: apps/desktop
        run: npm run test:integration

      - name: Build application
        working-directory: apps/desktop
        run: npm run build

  # --------------------------------------------------------------------------
  # Windows Bash sandbox - single file only
  # --------------------------------------------------------------------------
  # zeenha fork: the full Windows suite has known unported failures, so only the
  # sandbox integration test runs here. It exercises the real restricted-token launcher.
  test-windows-sandbox:
    name: test-windows-sandbox
    runs-on: windows-latest
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run Windows sandbox integration test
        working-directory: apps/desktop
        run: npx vitest run src/main/ai/security/__tests__/sandbox-windows.integration.test.ts

  # --------------------------------------------------------------------------
  # Dependency Audit
  # --------------------------------------------------------------------------
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run dependency audit gate
        working-directory: apps/desktop
        run: npm run audit:gate

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-frontend, dependency-audit]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          echo "CI Job Results:"
          echo "  test-frontend: ${{ needs.test-frontend.result }}"
          echo "  dependency-audit: ${{ needs.dependency-audit.result }}"
          echo ""

          if [[ "${{ needs.test-frontend.result }}" != "success" || "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
