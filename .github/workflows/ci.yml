# Cross-Platform CI Pipeline
#
# Tests on all target platforms (Linux, Windows, macOS) to catch
# platform-specific bugs before they merge. Linux gates CI Complete; macOS and
# Windows are advisory (see test-frontend-macos and test-frontend-windows).
#
# Path filters skip unrelated changes, but CLI guide changes still run CI.

name: CI

on:
  push:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/**'
      - 'guides/CLI-USAGE.md'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/**'
      - 'guides/CLI-USAGE.md'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

  # Weekly run: new advisories appear without code changes. Path filters only
  # apply to push and pull_request, so they are unaffected.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # Frontend Tests - All Platforms
  # --------------------------------------------------------------------------
  test-frontend:
    name: test-frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # zeenha fork: only Linux gates CI Complete. macOS and Windows run in
        # test-frontend-macos and test-frontend-windows below as advisory jobs.
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: npm run test:coverage

      - name: Run integration tests
        working-directory: apps/desktop
        run: npm run test:integration

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/desktop/coverage/
          retention-days: 14

      - name: Coverage PR comment
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/desktop
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Build application
        working-directory: apps/desktop
        run: npm run build

  # --------------------------------------------------------------------------
  # Frontend Tests - macOS (advisory)
  # --------------------------------------------------------------------------
  # zeenha fork: hosted macOS arm64 runners are capacity-constrained, and jobs are
  # often cancelled with "The job was not acquired by Runner of type hosted even
  # after multiple attempts". That turned CI Complete red on PRs that had no macOS
  # test failures. The job still runs and reports, but CI Complete does not need it.
  test-frontend-macos:
    name: test-frontend (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Run unit tests
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Run integration tests
        working-directory: apps/desktop
        run: npm run test:integration

      - name: Build application
        working-directory: apps/desktop
        run: npm run build

  # --------------------------------------------------------------------------
  # Frontend Tests - Windows (advisory)
  # --------------------------------------------------------------------------
  # zeenha fork: advisory until it has passed on main for two weeks. Then add
  # `test-frontend-windows` to ci-complete `needs` and to its result check, and
  # remove `continue-on-error`. Typecheck is not repeated here (Linux covers it).
  test-frontend-windows:
    name: test-frontend (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      # Same selection as `npm run test:unit`, plus a JSON report for the summary.
      - name: Run unit tests
        working-directory: apps/desktop
        shell: bash
        run: npx vitest run --exclude src/__tests__/integration/ --exclude src/__tests__/e2e/ --reporter=default --reporter=json --outputFile.json=test-results/windows-unit.json

      - name: Windows test summary
        if: always()
        working-directory: apps/desktop
        shell: bash
        run: node scripts/windows-test-summary.cjs test-results/windows-unit.json

  # --------------------------------------------------------------------------
  # Windows Bash sandbox - single file only
  # --------------------------------------------------------------------------
  # zeenha fork: the full unit suite now runs in test-frontend-windows above. This
  # job stays as the real-launcher check: it exercises the real restricted-token launcher.
  test-windows-sandbox:
    name: test-windows-sandbox
    runs-on: windows-latest
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run Windows sandbox integration test
        working-directory: apps/desktop
        run: npx vitest run src/main/ai/security/__tests__/sandbox-windows.integration.test.ts

  # --------------------------------------------------------------------------
  # Dependency Audit
  # --------------------------------------------------------------------------
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run dependency audit gate
        working-directory: apps/desktop
        run: npm run audit:gate

  # --------------------------------------------------------------------------
  # Headless CLI - Clean source build
  # --------------------------------------------------------------------------
  # zeenha fork: keep the install and build steps copyable from guides/CLI-USAGE.md.
  # No cache or composite setup: the guide must work on a clean runner.
  cli-build:
    name: cli-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up source Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check source toolchain versions
        run: |
          node_version=$(node --version)
          npm_version=$(npm --version)
          printf 'Node.js %s\nnpm %s\n' "$node_version" "$npm_version"
          node_version=${node_version#v}
          if (( ${node_version%%.*} < 24 || ${npm_version%%.*} < 10 )); then
            echo '::error::Building the CLI requires Node.js 24+ and npm 10+.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        working-directory: apps/desktop
        run: npm run build

      - name: Check and hash build output
        working-directory: apps/desktop/out
        shell: bash
        run: |
          test -f main/cli.js
          test -f main/ai/agent/worker.js
          find . -type f ! -path './SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload CLI build output
        uses: actions/upload-artifact@v4
        with:
          name: cli-out
          path: apps/desktop/out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  # --------------------------------------------------------------------------
  # Headless CLI - Runtime smoke
  # --------------------------------------------------------------------------
  # zeenha fork: test the same build under each Node runtime. Dependencies are
  # installed on the source toolchain before selecting the runtime Node version.
  cli-runtime:
    name: cli-runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: cli-build
    # Node 22 is informational until the smoke passes; the guide must not advertise it yet.
    continue-on-error: ${{ matrix.node == '22' }}

    strategy:
      fail-fast: false
      matrix:
        node: ['24', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up source Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download CLI build output
        uses: actions/download-artifact@v4
        with:
          name: cli-out
          path: apps/desktop/out/

      - name: Verify CLI build checksums
        working-directory: apps/desktop/out
        run: sha256sum -c SHA256SUMS

      - name: Select runtime Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check runtime Node.js version
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: |
          node_version=$(node --version)
          echo "Node.js $node_version"
          if [[ "${node_version%%.*}" != "v$EXPECTED_NODE_MAJOR" ]]; then
            echo "::error::Expected Node.js $EXPECTED_NODE_MAJOR, got $node_version."
            exit 1
          fi

      - name: Smoke-test built CLI
        working-directory: apps/desktop
        run: node scripts/cli-runtime-smoke.mjs out/main/cli.js

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-frontend, dependency-audit, cli-build, cli-runtime]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          echo "CI Job Results:"
          echo "  test-frontend: ${{ needs.test-frontend.result }}"
          echo "  dependency-audit: ${{ needs.dependency-audit.result }}"
          echo "  cli-build: ${{ needs.cli-build.result }}"
          echo "  cli-runtime: ${{ needs.cli-runtime.result }}"
          echo ""

          if [[ "${{ needs.test-frontend.result }}" != "success" ||
                "${{ needs.dependency-audit.result }}" != "success" ||
                "${{ needs.cli-build.result }}" != "success" ||
                "${{ needs.cli-runtime.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
