name: Codex on owner comments

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex:
    if: >-
      github.repository == 'elshazlyhefny/Aperant' &&
      github.event.comment.user.login == 'elshazlyhefny' &&
      github.event.sender.login == 'elshazlyhefny' &&
      github.triggering_actor == 'elshazlyhefny' &&
      contains(github.event.comment.body, '@codex')
    uses: ./.github/workflows/owner-comment-agent.yml
    with:
      agent: codex
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
