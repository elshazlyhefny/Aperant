name: Lint

on:
  push:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/beta-release.yml'
      - '.github/actions/**'
      - 'scripts/check-action-pins*.mjs'
      - 'apps/desktop/biome.jsonc'
      - 'scripts/release-signing-gate*'
      - 'scripts/verify-windows-signatures.ps1'
  pull_request:
    branches: [main, develop, zeenha]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/beta-release.yml'
      - '.github/actions/**'
      - 'scripts/check-action-pins*.mjs'
      - 'apps/desktop/biome.jsonc'
      - 'scripts/release-signing-gate*'
      - 'scripts/verify-windows-signatures.ps1'
  # zeenha fork: run the required gate on merge-queue commits, so each PR is
  # tested on top of the latest trunk and the PRs queued before it. merge_group
  # takes no path filters, so every queued commit runs the full gate.
  merge_group:
    types: [checks_requested]

# zeenha fork: a merge_group run has no PR number, and its github.ref
# (refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>) is unique per queued
# commit, so queue runs never cancel one another or a PR run.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # TypeScript/JavaScript linting (Biome) - 15-25x faster than ESLint
  typescript:
    name: TypeScript (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test owner comment workflow safeguards
        run: python3 -B -m unittest discover -s .github/actions/comment-agent

      # zeenha fork: Guard the release signing checks without installing dependencies.
      - name: Test release signing gate
        run: node --test scripts/release-signing-gate.test.mjs

      # zeenha fork: prevent mutable actions from re-entering the release path.
      - name: Check release workflows pin actions to commit SHAs
        run: |
          node --test scripts/check-action-pins.test.mjs
          node scripts/check-action-pins.mjs

      # Pin version to match package.json for consistent behavior
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.11

      - name: Run Biome
        working-directory: apps/desktop
        # biome ci fails on errors by default; warnings are reported but don't block
        # Use --error-on-warnings when ready to enforce all rules
        run: biome ci .

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  lint-complete:
    name: Lint Complete
    runs-on: ubuntu-latest
    needs: [typescript]
    if: always()
    steps:
      - name: Check lint results
        run: |
          if [[ "${{ needs.typescript.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            echo "  TypeScript: ${{ needs.typescript.result }}"
            exit 1
          fi
          echo "✅ All linting passed"
